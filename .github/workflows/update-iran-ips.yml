name: Generate MikroTik Iran IP List
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_ips.txt

permissions:
  contents: write
concurrency:
  group: generate-mikrotik-iran-ip-list
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate RSC Files
        run: |
          set -euo pipefail
          
          # Initialize files with headers
          echo "# Generated on $(date)" > iran_list.rsc
          echo "# Generated on $(date)" > iran_routes.rsc
          
          # Declare globals at the top so the /import scope can see them
          echo ":global irtable" >> iran_routes.rsc
          echo ":global irgw" >> iran_routes.rsc
          echo ":global irgw2" >> iran_routes.rsc
          echo ":global irprefsrc" >> iran_routes.rsc
          echo ":global irdistance" >> iran_routes.rsc
          echo ":global irdistance2" >> iran_routes.rsc
          echo ":global ircheckgateway" >> iran_routes.rsc
          
          # Resolve primary distance: default 50 unless a valid numeric override is passed via $irdistance
          echo ":local irDistanceVal 50" >> iran_routes.rsc
          echo ":if ([:typeof \$irdistance] != \"nothing\" && \$irdistance != \"\") do={" >> iran_routes.rsc
          echo "  :local irDistanceParsed [:tonum \$irdistance]" >> iran_routes.rsc
          echo "  :if ([:typeof \$irDistanceParsed] = \"num\") do={ :set irDistanceVal \$irDistanceParsed }" >> iran_routes.rsc
          echo "}" >> iran_routes.rsc
          
          # Resolve backup (gw2) distance: defaults to primary + 10 unless a valid numeric
          # override is passed via $irdistance2. Defaulting relative to the *resolved* primary
          # distance keeps gw2 lower-priority even if $irdistance itself was overridden.
          echo ":local irDistanceVal2 (\$irDistanceVal + 10)" >> iran_routes.rsc
          echo ":if ([:typeof \$irdistance2] != \"nothing\" && \$irdistance2 != \"\") do={" >> iran_routes.rsc
          echo "  :local irDistanceParsed2 [:tonum \$irdistance2]" >> iran_routes.rsc
          echo "  :if ([:typeof \$irDistanceParsed2] = \"num\") do={ :set irDistanceVal2 \$irDistanceParsed2 }" >> iran_routes.rsc
          echo "}" >> iran_routes.rsc
          
          # Resolve check-gateway: default "ping" (health-checks the gateway and enables
          # automatic failover to the next-lowest-distance route). Set $ircheckgateway="no"
          # to disable checking (check-gateway=none is a valid explicit RouterOS enum value,
          # so unlike pref-src it does not need to be structurally omitted). Any other value
          # (e.g. "arp" or "bfd") is passed through as-is.
          echo ":local irCheckGatewayVal \"ping\"" >> iran_routes.rsc
          echo ":if ([:typeof \$ircheckgateway] != \"nothing\" && \$ircheckgateway != \"\") do={" >> iran_routes.rsc
          echo "  :if (\$ircheckgateway = \"no\") do={ :set irCheckGatewayVal \"none\" } else={ :set irCheckGatewayVal \$ircheckgateway }" >> iran_routes.rsc
          echo "}" >> iran_routes.rsc
          
          # Cleanup logic
          echo "/ip firewall address-list remove [find list=\"IRAN_IPS\"]" >> iran_list.rsc
          # Quoting \"\$irtable\" prevents the 'ambiguous' error in RouterOS v7
          echo "/ip route remove [find comment=\"IR_BGP_DATA\" routing-table=\"\$irtable\"]" >> iran_routes.rsc          
          echo ":delay 2s" >> iran_routes.rsc
          
          # Fetch IP data
          if ! ip_data=$(curl -fsSL https://raw.githubusercontent.com/ipverse/rir-ip/master/country/ir/ipv4-aggregated.txt); then
            echo "Error: Failed to fetch IP data"
            exit 1
          fi
          
          if [ -z "$ip_data" ]; then
            echo "Error: Fetched IP data is empty; aborting."
            exit 1
          fi

          # Merge ipverse data with the hand-maintained ranges in custom_ips.txt (ranges
          # used in Iran that RIR delegation data / ipverse lists under another country,
          # e.g. 77.104.64.0/18 is listed under AE). Custom entries are validated
          # strictly: a bad line fails the run, so nothing is committed. The merged set is
          # deduplicated and overlapping ranges are combined, because RouterOS rejects
          # duplicate address-list entries ("already have such entry"), which would abort
          # the whole /import.
          printf '%s\n' "$ip_data" > ipverse.tmp
          python3 - ipverse.tmp custom_ips.txt merged.tmp <<'PY'
          import ipaddress
          import os
          import sys

          ipverse_path, custom_path, out_path = sys.argv[1:4]

          ipverse = []
          with open(ipverse_path) as f:
              for raw in f:
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  try:
                      ipverse.append(ipaddress.IPv4Network(line, strict=False))
                  except ValueError:
                      print(f"::warning::Skipping invalid ipverse line: {line}")

          # Never let custom entries mask a broken upstream fetch (e.g. an HTML error page):
          # committing a list with only the custom ranges would drop every IR route on routers.
          if not ipverse:
              print("::error::No valid IPv4 ranges found in ipverse data; aborting.")
              sys.exit(1)

          custom = []
          errors = 0
          if os.path.exists(custom_path):
              with open(custom_path) as f:
                  for lineno, raw in enumerate(f, 1):
                      entry = raw.split("#", 1)[0].strip()
                      if not entry:
                          continue
                      try:
                          # Strict: host bits must be zero; a bare IP becomes /32.
                          net = ipaddress.IPv4Network(entry)
                      except ValueError as e:
                          print(f"::error file={custom_path},line={lineno}::Invalid IPv4 network '{entry}': {e}")
                          errors += 1
                          continue
                      covering = next((n for n in ipverse if net.subnet_of(n)), None)
                      if covering is not None:
                          print(f"::notice file={custom_path},line={lineno}::{net} is already covered by ipverse ({covering}); it can be removed from {custom_path}.")
                      custom.append(net)

          if errors:
              print(f"Error: {errors} invalid entr{'y' if errors == 1 else 'ies'} in {custom_path}; aborting.")
              sys.exit(1)

          merged = list(ipaddress.collapse_addresses(ipverse + custom))
          with open(out_path, "w") as f:
              f.writelines(f"{n}\n" for n in merged)
          print(f"ipverse: {len(ipverse)} ranges, custom: {len(custom)} ranges, merged: {len(merged)} ranges")
          PY
          ip_data=$(cat merged.tmp)
          rm -f ipverse.tmp merged.tmp
          
          # Process the data into address-list entries, plus four route variants:
          # gw1/gw2 x with/without pref-src. RouterOS aborts the whole import on a runtime
          # error, so pref-src must be structurally omitted (not passed empty) when unset.
          # check-gateway is always included since check-gateway=none is a valid explicit
          # value (unlike pref-src), so it needs no such branching.
          > routes_gw1_with_prefsrc.tmp
          > routes_gw1_without_prefsrc.tmp
          > routes_gw2_with_prefsrc.tmp
          > routes_gw2_without_prefsrc.tmp
          echo "$ip_data" | grep -v '^#' | while read -r line; do
            if [[ "$line" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}/(3[0-2]|[12][0-9]|[0-9])$ ]]; then
              echo "/ip firewall address-list add list=IRAN_IPS address=$line" >> iran_list.rsc
              # Essential: Quote the variables to ensure ROS v7 treats them as strings
              echo "/ip route add distance=\$irDistanceVal dst-address=$line gateway=\"\$irgw\" routing-table=\"\$irtable\" pref-src=\"\$irprefsrc\" check-gateway=\$irCheckGatewayVal comment=\"IR_BGP_DATA\"" >> routes_gw1_with_prefsrc.tmp
              echo "/ip route add distance=\$irDistanceVal dst-address=$line gateway=\"\$irgw\" routing-table=\"\$irtable\" check-gateway=\$irCheckGatewayVal comment=\"IR_BGP_DATA\"" >> routes_gw1_without_prefsrc.tmp
              echo "/ip route add distance=\$irDistanceVal2 dst-address=$line gateway=\"\$irgw2\" routing-table=\"\$irtable\" pref-src=\"\$irprefsrc\" check-gateway=\$irCheckGatewayVal comment=\"IR_BGP_DATA\"" >> routes_gw2_with_prefsrc.tmp
              echo "/ip route add distance=\$irDistanceVal2 dst-address=$line gateway=\"\$irgw2\" routing-table=\"\$irtable\" check-gateway=\$irCheckGatewayVal comment=\"IR_BGP_DATA\"" >> routes_gw2_without_prefsrc.tmp
            fi
          done
          
          # Only include pref-src when the router-side $irprefsrc is actually set;
          # otherwise the parameter is fully omitted (an empty/undefined pref-src aborts /import).
          echo ":if ([:typeof \$irprefsrc] != \"nothing\" && \$irprefsrc != \"\") do={" >> iran_routes.rsc
          cat routes_gw1_with_prefsrc.tmp >> iran_routes.rsc
          echo "} else={" >> iran_routes.rsc
          cat routes_gw1_without_prefsrc.tmp >> iran_routes.rsc
          echo "}" >> iran_routes.rsc
          
          # Backup gateway (gw2) routes only exist if the router-side $irgw2 is set;
          # otherwise this whole block is skipped and behavior matches single-gateway mode.
          echo ":if ([:typeof \$irgw2] != \"nothing\" && \$irgw2 != \"\") do={" >> iran_routes.rsc
          echo "  :if ([:typeof \$irprefsrc] != \"nothing\" && \$irprefsrc != \"\") do={" >> iran_routes.rsc
          cat routes_gw2_with_prefsrc.tmp >> iran_routes.rsc
          echo "  } else={" >> iran_routes.rsc
          cat routes_gw2_without_prefsrc.tmp >> iran_routes.rsc
          echo "  }" >> iran_routes.rsc
          echo "}" >> iran_routes.rsc
          
          rm -f routes_gw1_with_prefsrc.tmp routes_gw1_without_prefsrc.tmp routes_gw2_with_prefsrc.tmp routes_gw2_without_prefsrc.tmp
          
          echo ":log info \"Iran IP Address List generated.\"" >> iran_list.rsc
          echo ":log info \"Iran Routes generated for table \$irtable.\"" >> iran_routes.rsc

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Commit only when the generated content actually changed (ipverse data or
          # custom_ips.txt). The "# Generated on" line changes on every run, so it is
          # ignored here; otherwise every run would make a timestamp-only commit.
          strip_timestamp() { grep -v '^# Generated on ' || true; }
          changed=false
          for f in iran_list.rsc iran_routes.rsc; do
            if ! cmp -s <(git show "HEAD:$f" 2>/dev/null | strip_timestamp) <(strip_timestamp < "$f"); then
              changed=true
            fi
          done

          if [ "$changed" = false ]; then
            echo "No IP data changes (only the timestamp differs); skipping commit."
            exit 0
          fi

          git add iran_list.rsc iran_routes.rsc
          git commit -m "chore(data): update Iran IP list"
          if ! git push; then
            echo "Error: git push failed."
            exit 1
          fi
